- aid: kentico:kentico-xperience-portal-api
  name: Xperience Portal API
  description: HTTP API for the Kentico SaaS control plane. Uploads a deployment ZIP
    package to an Xperience Portal project environment so CI/CD pipelines can deploy
    without using the Portal UI. Authenticated with a Personal Access Token sent as
    a Bearer token; the project is addressed by its PROJECT_GUID in the path and the
    target environment (qa, staging, prod) as the final path segment. Packages are
    limited to 2 GB and deployments are queued one at a time per project. This is
    the only Kentico API served from a host Kentico itself operates.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.kentico.com/documentation/developers-and-admins/deployment/deploy-to-the-saas-environment
  baseURL: https://xperience-portal.com/api
  tags:
