    url: https://community.kentico.com
- aid: kentico:kentico-management-api
  name: Xperience by Kentico Management API
  description: Preview REST management API exposed by an Xperience by Kentico application
    at the kentico-api/management path once the Kentico.Xperience.ManagementApi package
    is installed and AddKenticoManagementApi() is called. Provides CRUD over content
    types, reusable field schemas, content items, pages, folders, assets, channels,
    workspaces, languages, taxonomies, tags and Page Builder components. Authenticated
    with a shared secret of at least 32 characters. Kentico documents it as local-development
    only - it has basic authentication and no per-operation authorization. It is the
    API the Management MCP server introspects and republishes as agent tools.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.kentico.com/documentation/developers-and-admins/api/management-api
  baseURL: https://{project-domain}/kentico-api/management
